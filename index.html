const AI_CHUNK_CHARS = 350000;   // longer transcripts are processed part by part, then merged
const AI_PRESETS = [
  { key: 'clean',    label: '✨ Clean up',        reduce: false, prompt: 'Clean up this transcript: add punctuation and capitalization, fix obvious transcription errors, remove filler words (um, uh, you know, like), and split it into logical paragraphs. Keep speaker labels if present. Preserve the original meaning and wording otherwise. Do not include timestamps in the output.' },
  { key: 'summary',  label: '📝 Summary',         reduce: true,  prompt: 'Write a concise summary of this transcript: 2–3 sentences of overview followed by the key points as a bulleted list.' },
  { key: 'minutes',  label: '🗓️ Meeting minutes', reduce: true,  prompt: 'Turn this transcript into structured meeting minutes with these sections: Overview, Attendees (from speaker labels or context), Topics discussed, Decisions made, Action items (with owners where mentioned), and Open questions. Use the timestamps to keep the order of discussion.' },
  { key: 'actions',  label: '✅ Action items',    reduce: true,  prompt: 'Extract every action item, commitment, or follow-up from this transcript as a checklist. For each item include the owner (if identifiable) and any deadline mentioned.' },
  { key: 'speakers', label: '🗣️ Name speakers',   reduce: false, prompt: 'Rewrite this transcript with speaker labels. If the transcript already has labels such as "Speaker 1", infer each speaker\'s real name or role from context where possible and use it consistently; otherwise infer speaker changes from conversational turns. Clean up punctuation as you go. Do not include timestamps in the output.' },
  { key: 'translate',label: '🌐 Translate → EN',  reduce: false, prompt: 'Translate this transcript into natural, fluent English, preserving meaning, tone and any speaker labels. Split it into readable paragraphs.' },
  { key: 'qa',       label: '❓ Questions asked', reduce: true,  prompt: 'List every question that was asked in this transcript, who asked it (if identifiable), and whether/how it was answered.' },
  { key: 'custom',   label: '⚙️ Custom…',         reduce: true,  prompt: '' },

const AI_SYSTEM = 'You are an expert transcription editor and note-taker. Work only from the transcript provided by the user. Output only the requested result — no preamble, no commentary, no code fences.';

function aiHeaders(key, withFallbacks) {
  const h = {
    'Content-Type': 'application/json',
    'x-api-key': key,
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true',
  };
  if (withFallbacks) h['anthropic-beta'] = 'server-side-fallback-2026-07-01';

}
// One streamed Messages request; onDelta receives the text so far.
async function claudeStream(key, userText, onDelta, signal, withFallbacks) {
  if (withFallbacks === undefined) withFallbacks = true;
  const body = { model: AI_MODEL, max_tokens: 64000, stream: true, system: AI_SYSTEM, messages: [{ role: 'user', content: userText }] };
  if (withFallbacks) body.fallbacks = 'default';
  const resp = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: aiHeaders(key, withFallbacks), body: JSON.stringify(body), signal });
  if (!resp.ok) {
    let data = null;
    try { data = await resp.json(); } catch (e) {}

    if (resp.status === 400 && withFallbacks && /fallback|beta/i.test(msg)) return claudeStream(key, userText, onDelta, signal, false);

    if (resp.status === 429) throw new Error('Rate limited by the API — wait a moment and try again.');

  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', text = '', stopReason = null, stopDetails = null;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const evt = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of evt.split('\n')) {
        if (!line.startsWith('data:')) continue;
        const json = line.slice(5).trim();
        if (!json) continue;
        let d; try { d = JSON.parse(json); } catch (e) { continue; }
        if (d.type === 'content_block_delta' && d.delta && d.delta.type === 'text_delta') { text += d.delta.text; if (onDelta) onDelta(text); }
        else if (d.type === 'message_delta') { const dl = d.delta || {}; if (dl.stop_reason) stopReason = dl.stop_reason; stopDetails = dl.stop_details || d.stop_details || stopDetails; }
        else if (d.type === 'error') throw new Error((d.error && d.error.message) || 'Stream error');
      }
    }
  }
  if (stopReason === 'refusal') throw new Error('The model declined this request' + (stopDetails && stopDetails.category ? ' (' + stopDetails.category + ')' : '') + '.');
  text = text.trim();
  if (!text) throw new Error('The model returned an empty response.');
  if (stopReason === 'max_tokens') text += '\n\n[Output truncated — the result reached the maximum length.]';
  return text;
}
function splitTranscriptText(text, maxChars) {
  const parts = []; let cur = '';
  for (const line of text.split('\n')) {
    if (cur.length + line.length + 1 > maxChars && cur) { parts.push(cur); cur = ''; }
    cur += (cur ? '\n' : '') + line;
  }
  if (cur) parts.push(cur);
  return parts;
}
// Runs a preset over the whole transcript. Long transcripts are processed
// part by part and, for summarising tasks, merged with a final pass.
async function runAssistant(preset, promptText, transcriptText, onProgress, signal) {
  const key = (state.settings.apiKey || '').trim();
  if (!key) throw new Error('no-key');
  const framed = (body, note) => promptText + (note ? '\n\n' + note : '') + '\n\n--- TRANSCRIPT (timestamps are [hh:mm:ss]) ---\n' + body;
  if (transcriptText.length <= AI_SINGLE_MAX) return claudeStream(key, framed(transcriptText), (txt) => onProgress(txt, ''), signal);
  const parts = splitTranscriptText(transcriptText, AI_CHUNK_CHARS);
  const outs = [];
  for (let i = 0; i < parts.length; i++) {
    const note = 'This is part ' + (i + 1) + ' of ' + parts.length + ' of a long transcript. Apply the instructions to this part only.';
    const partial = await claudeStream(key, framed(parts[i], note), (txt) => onProgress(outs.concat([txt]).join('\n\n'), 'Part ' + (i + 1) + ' of ' + parts.length), signal);
    outs.push(partial);
  }
  if (!preset.reduce) return outs.join('\n\n');
  const combined = outs.map((o, i) => '--- RESULT FOR PART ' + (i + 1) + ' ---\n' + o).join('\n\n');
  if (combined.length > AI_SINGLE_MAX) return outs.join('\n\n');
  return claudeStream(key,
    'The following are partial results produced by applying this instruction to consecutive parts of one long transcript:\n\n"' + promptText + '"\n\n' +
    'Merge them into one coherent final result that satisfies the instruction for the whole transcript. Remove duplication, keep chronological order, and do not mention the parts.\n\n' + combined,
    (txt) => onProgress(txt, 'Combining ' + parts.length + ' parts'), signal);
}

function segRowHtml(t, s, i) {
  const prev = i > 0 ? t.segments[i - 1] : null;
  const hasSpk = s.spk != null && s.spk >= 0;
  const changed = hasSpk && (!prev || prev.spk !== s.spk);
  return '<div class="seg' + (hasSpk ? ' has-spk' : '') + (changed ? ' spk-start' : '') + '" data-i="' + i + '"' + (hasSpk ? ' style="--spk:' + speakerColor(s.spk) + '"' : '') + '>' +
    '<button class="seg-t" onclick="App.seek(' + s.start.toFixed(2) + ')" title="Jump to ' + fmtClock(s.start) + '">' + fmtClock(s.start) + '</button>' +
    '<div class="seg-body">' +
      (changed ? '<button class="seg-spk" onclick="App.renameSpeaker(\'' + t.id + '\',' + s.spk + ')" title="Rename this speaker everywhere">' + escapeHtml(speakerName(t, s.spk)) + '</button>' : '') +
      '<div class="seg-x" contenteditable="true" spellcheck="false" data-i="' + i + '">' + escapeHtml(s.text) + '</div>' +
    '</div></div>';
}
function appendSegRows(t, cues, fromIndex) {
  const wrap = $('#seg-wrap');
  if (!wrap) return;
  const empty = wrap.querySelector('.lib-empty');
  if (empty) empty.remove();
  const html = cues.map((c, k) => segRowHtml(t, c, fromIndex + k)).join('');
  wrap.insertAdjacentHTML('beforeend', html);
}

async function attachPlayer(t) {
  const bar = $('#player-bar'), player = $('#player');
  if (!bar || !player) return;
  try {
    if (state.player.forId !== t.id) {
      const a = await dbGet('audio', t.id);
      if (state.player.url) URL.revokeObjectURL(state.player.url);
      state.player.url = a && a.blob ? URL.createObjectURL(a.blob) : null;
      state.player.forId = t.id;
    }
    if (!state.player.url) return;
    player.src = state.player.url;
    player.playbackRate = state.settings.playbackRate || 1;
    bar.style.display = '';
    let lastIdx = -1;
    player.ontimeupdate = () => {
      const t2 = getT(state.route.id);
      if (!t2 || state.tvTab !== 'transcript') return;
      const time = player.currentTime;
      let idx = -1;
      const segs = t2.segments;
      for (let i = 0; i < segs.length; i++) {
        if (time >= segs[i].start - 0.15 && time < segs[i].end + 0.35) { idx = i; break; }
        if (segs[i].start > time) break;
      }
      if (idx === lastIdx) return;
      const prev = $('.seg.now');
      if (prev) prev.classList.remove('now');
      lastIdx = idx;
      if (idx >= 0) {
        const row = $('.seg[data-i="' + idx + '"]');
        if (row) {
          row.classList.add('now');
          if (state.follow && !player.paused && document.activeElement && !document.activeElement.closest('.seg-x')) {
            row.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
        }
      }
    };
  } catch (e) {}
}

function updateProcUI() {
  const job = state.job;
  if (!job || !isCurrentView(job.tid)) { renderSidebarThrottled(); return; }
  const phase = $('#proc-phase'), pct = $('#proc-pct'), fill = $('#proc-fill'), bar = $('#proc-bar'), live = $('#proc-live'), stats = $('#proc-stats'), warn = $('#proc-warn');
  if (!phase) return;
  phase.textContent = job.phase;
  if (job.pct == null) { bar.classList.add('indet'); pct.textContent = ''; }
  else { bar.classList.remove('indet'); fill.style.width = job.pct + '%'; pct.textContent = job.pct + '%'; }
  live.textContent = job.live || '';
  if (warn) { warn.textContent = job.warn || ''; warn.style.display = job.warn ? '' : 'none'; }
  const mins = Math.round((Date.now() - job.startedAt) / 6000) / 10;
  const bits = [];
  if (job.words) bits.push(job.words.toLocaleString() + ' words');
  bits.push(mins + ' min elapsed');
  if (job.speed) bits.push(job.speed.toFixed(1) + '× realtime');
  if (job.eta != null && job.eta > 0) bits.push(fmtEta(job.eta) + ' left');
  if (state.gpu) bits.push(state.gpu === 'webgpu' ? 'GPU' : 'CPU');
  stats.textContent = bits.join(' · ');
}
const renderSidebarThrottled = debounce(renderSidebar, 800);

/* search inside transcript */
function applyTvSearch() {
  const q = state.tvSearch.trim().toLowerCase();
  const t = getT(state.route.id);
  const count = $('#tv-count');
  if (!t) return;
  let matches = 0;
  $$('#seg-wrap .seg-x').forEach(el => {
    const i = parseInt(el.dataset.i, 10);
    const text = (t.segments[i] || {}).text || '';
    if (!q) { el.textContent = text; return; }
    const lower = text.toLowerCase();
    let pos = 0, out = '', found = lower.indexOf(q, pos);
    if (found === -1) { el.textContent = text; return; }
    while (found !== -1) {
      out += escapeHtml(text.slice(pos, found)) + '<mark>' + escapeHtml(text.slice(found, found + q.length)) + '</mark>';
      pos = found + q.length;
      matches++;
      found = lower.indexOf(q, pos);
    }
    out += escapeHtml(text.slice(pos));
    el.innerHTML = out;
  });
  if (count) count.textContent = q ? matches + ' match' + (matches === 1 ? '' : 'es') : '';
  if (q && matches) {
    const first = $('#seg-wrap mark');
    if (first) first.scrollIntoView({ block: 'center' });
  }
}

function openModal(html) {
  const ov = $('#overlay');

}
function closeModal() {
  const ov = $('#overlay');

function confirmDialog(title, msg, okLabel) {
  return new Promise(res => {
    openModal(
      '<div class="modal" style="max-width:420px;">' +
        '<div class="modal-h"><h3>' + escapeHtml(title) + '</h3><button class="x-btn" id="cf-x">✕</button></div>' +
        '<div class="modal-b"><p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:18px;">' + escapeHtml(msg) + '</p>' +
        '<div style="display:flex;gap:10px;justify-content:flex-end;">' +
          '<button class="btn" id="cf-no">Cancel</button>' +
          '<button class="btn btn-danger" id="cf-yes" style="border-color:rgba(248,113,113,.4);">' + escapeHtml(okLabel || 'Delete') + '</button>' +
        '</div></div></div>');
    $('#cf-no').onclick = () => { closeModal(); res(false); };
    $('#cf-x').onclick = () => { closeModal(); res(false); };
    $('#cf-yes').onclick = () => { closeModal(); res(true); };
  });
}
function promptDialog(title, label, value, okLabel) {
  return new Promise(res => {
    openModal(
      '<div class="modal" style="max-width:420px;">' +
        '<div class="modal-h"><h3>' + escapeHtml(title) + '</h3><button class="x-btn" id="pd-x">✕</button></div>' +
        '<div class="modal-b"><div class="row field"><label>' + escapeHtml(label) + '</label><input class="txt-input" id="pd-in" type="text" value="' + escapeHtml(value || '') + '" maxlength="60"></div>' +
        '<div style="display:flex;gap:10px;justify-content:flex-end;">' +
          '<button class="btn" id="pd-no">Cancel</button>' +
          '<button class="btn btn-primary" id="pd-yes">' + escapeHtml(okLabel || 'Save') + '</button>' +
        '</div></div></div>');
    const input = $('#pd-in');
    const done = (ok) => { const v = input.value.trim(); closeModal(); res(ok ? v : null); };
    $('#pd-no').onclick = () => done(false);
    $('#pd-x').onclick = () => done(false);
    $('#pd-yes').onclick = () => done(true);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } });
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}

/* ════════════════════════════════════════════════════════════════

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('t/')) return { view: 'transcript', id: h.slice(2) };
  return { view: 'home', id: null };
}
function render() {
  state.route = parseRoute();
  closeAllMenus();
  if (state.route.view === 'transcript') {
    if (!getT(state.route.id)) { location.hash = ''; return; }
    if (state.route.id !== state._lastId) { state.tvTab = 'transcript'; state.tvSearch = ''; }
    state._lastId = state.route.id;
    renderTranscript(state.route.id);
  } else {
    renderHome();
  }
  renderSidebar();
  App.toggleSidebar(false);
}
function closeAllMenus() { $$('.menu.open').forEach(m => m.classList.remove('open')); }
document.addEventListener('click', (e) => { if (!e.target.closest('.menu-wrap')) closeAllMenus(); });

let aiAbort = null;
const App = {
  go(path) { const target = '#/' + path; if (location.hash === target || (path === '' && (location.hash === '' || location.hash === '#/'))) render(); else location.hash = target; },
  toggleSidebar(open) {
    $('#sidebar').classList.toggle('open', !!open);
    $('#sb-back').classList.toggle('show', !!open);
  },
  filterLib(v) { state.libFilter = v; renderSidebar(); },
  setOpt(key, val) {
    state.settings[key] = val;
    dbPut('settings', { key: 'app', value: state.settings }).catch(() => {});
    if (key === 'recSource' || key === 'liveCaptions') renderRecCard();
  },
  setSpeakerOpt(v) {
    if (v === 'off') { App.setOpt('speakers', false); }
    else { state.settings.speakers = true; App.setOpt('maxSpeakers', parseInt(v, 10) || 0); }
  },
  startRec() { startRecording(); },
  pauseRec() { pauseRecording(); },
  stopRec(discard) { stopRecording(discard); },
  cancelJob() { cancelJob(); },
  retry(id) { retryTranscription(id, false); },
  resume(id) { retryTranscription(id, true); },
  seek(sec) {
    const p = $('#player');
    if (p && p.src) { p.currentTime = Math.max(0, sec - 0.1); p.play().catch(() => {}); }
  },
  setSpeed(v) {
    const r = parseFloat(v) || 1;
    App.setOpt('playbackRate', r);
    const p = $('#player'); if (p) p.playbackRate = r;
  },
  setFollow(v) { state.follow = v; },
  setTab(tab) { state.tvTab = tab; render(); },
  searchTv: debounce(function(v) { state.tvSearch = v; applyTvSearch(); }, 250),
  toggleMenu(e) {
    e.stopPropagation();
    const menu = e.target.closest('.menu-wrap').querySelector('.menu');
    const was = menu.classList.contains('open');
    closeAllMenus();
    if (!was) menu.classList.add('open');
  },
  exp(id, fmt) { closeAllMenus(); exportTranscript(id, fmt); },
  exportAll() { exportAll(); },
  copyTranscript(id) {
    const t = getT(id);
    if (!t || !t.segments.length) { toast('⚠️', 'Nothing to copy yet.'); return; }
    navigator.clipboard.writeText(transcriptFullText(t, state.settings.exportTs)).then(
      () => toast('📋', 'Transcript copied to clipboard.'),
      () => toast('❌', 'Could not access the clipboard.'));
  },
  async renameSpeaker(id, spk) {
    const t = getT(id);
    if (!t) return;
    const name = await promptDialog('Rename speaker', 'Name for ' + speakerName(t, spk) + ' (applies to every line)', speakerName(t, spk), 'Rename');
    if (name == null) return;
    t.speakers = t.speakers || {};
    if (name && name !== 'Speaker ' + (spk + 1)) t.speakers[spk] = name; else delete t.speakers[spk];
    await saveTranscript(t);
    render();
  },
  async deleteTranscript(id) {
    const t = getT(id);
    if (!t) return;
    const ok = await confirmDialog('Delete transcript?', '“' + t.title + '” and its stored audio will be permanently removed from this browser.', 'Delete');
    if (!ok) return;
    if (state.job && state.job.tid === id) cancelJob();
    state.transcripts = state.transcripts.filter(x => x.id !== id);
    await dbDel('transcripts', id).catch(() => {});
    await dbDel('audio', id).catch(() => {});
    if (state.player.forId === id && state.player.url) { URL.revokeObjectURL(state.player.url); state.player.url = null; state.player.forId = null; }
    toast('🗑️', 'Transcript deleted.');
    App.go('');
    updateStorageInfo();
  },
  openSettings() { openSettings(); },
  openAI(id) { openAI(id); },
  closeModal() { if (aiAbort) { aiAbort.abort(); aiAbort = null; } closeModal(); },
  saveAiKey(id) {
    const v = ($('#ai-key').value || '').trim();
    if (!v) { toast('⚠️', 'Paste your API key first.'); return; }
    App.setOpt('apiKey', v);
    openAI(id);
  },
  pickPreset(el) {
    $$('#ai-chips .chip').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    $('#ai-custom-row').style.display = el.dataset.k === 'custom' ? '' : 'none';
  },
  async runAI(id) {
    const t = getT(id);
    if (!t) return;
    const sel = $('#ai-chips .chip.sel');
    const preset = AI_PRESETS.find(p => p.key === (sel && sel.dataset.k)) || AI_PRESETS[0];
    let prompt = preset.prompt;
    if (preset.key === 'custom') {
      prompt = ($('#ai-custom').value || '').trim();
      if (!prompt) { toast('⚠️', 'Describe what you want the assistant to do.'); return; }
    }
    const btn = $('#ai-run'), stop = $('#ai-stop'), status = $('#ai-status'), stream = $('#ai-stream');
    btn.disabled = true; btn.textContent = 'Running…'; stop.style.display = '';
    status.style.display = ''; stream.style.display = ''; stream.textContent = '';
    status.innerHTML = '<div class="proc-label"><div class="spin"></div><span id="ai-stage">Claude is working on your transcript…</span></div>';
    aiAbort = new AbortController();
    const signal = aiAbort.signal;
    try {
      const out = await runAssistant(preset, prompt, transcriptFullText(t, true), (txt, stage) => {
        if (signal.aborted) return;
        const st = $('#ai-stage'); if (st && stage) st.textContent = stage + '…';
        const el = $('#ai-stream'); if (el) { el.textContent = txt; el.scrollTop = el.scrollHeight; }
      }, signal);
      if (signal.aborted) return;
      t.ai = { label: preset.key === 'custom' ? 'Custom prompt' : preset.label.replace(/^\S+\s/, ''), text: out, at: Date.now() };
      await saveTranscript(t);
      aiAbort = null;
      closeModal();
      state.tvTab = 'ai';
      render();
      toast('✨', 'AI result ready — saved with this transcript.');
    } catch (err) {
      if (signal.aborted) return;
      if (err.message === 'no-key') { closeModal(); openAI(id); return; }
      status.innerHTML = '<p style="color:var(--red);font-size:13px;line-height:1.6;">' + escapeHtml(err.message) + '</p>';
      btn.disabled = false; btn.textContent = 'Run →'; stop.style.display = 'none';
      aiAbort = null;
    }
  },
  stopAI() {
    if (aiAbort) { aiAbort.abort(); aiAbort = null; }
    const btn = $('#ai-run'), stop = $('#ai-stop'), status = $('#ai-status');
    if (btn) { btn.disabled = false; btn.textContent = 'Run →'; }
    if (stop) stop.style.display = 'none';
    if (status) status.innerHTML = '<p class="hint" style="margin:0;">Stopped.</p>';
  },
  copyAi(id) {
    const t = getT(id);
    if (t && t.ai) navigator.clipboard.writeText(t.ai.text).then(() => toast('📋', 'AI result copied.'));
  },
  downloadAi(id) {
    const t = getT(id);
    if (t && t.ai) download(new Blob([t.ai.text], { type: 'text/markdown;charset=utf-8' }), safeName(t.title) + ' — ' + safeName(t.ai.label) + '.md');
  },
  async preloadModels() {
    const btn = $('#preload-btn'), st = $('#preload-status');
    if (state.job) { toast('⏳', 'Wait for the current transcription to finish.'); return; }
    btn.disabled = true;
    const say = (m) => { if (st) st.textContent = m; };
    const prog = (label) => (d) => say('Downloading ' + label + (d.total ? ' — ' + fmtBytes(d.loaded) + ' of ' + fmtBytes(d.total) : '') + '…');
    try {
      say('Loading AI model…');
      const dev = await engine.ensureLoaded(activeModelId(state.settings.quality), prog('AI model'));
      state.gpu = dev;
      if (state.settings.speakers) { say('Loading speaker models…'); await speakerEngine.ensureSpeakersLoaded(prog('speaker models')); }
      say('Models are downloaded and cached — ready to transcribe offline.');
      toast('✅', 'Models downloaded and cached.');
    } catch (err) {
      say('Download failed: ' + friendlyError(err));
    }
    btn.disabled = false;
  },
  async wipeAll() {
    const ok = await confirmDialog('Delete all data?', 'Every transcript, recording and cached setting will be removed from this browser. This cannot be undone.', 'Delete everything');
    if (!ok) return;
    if (state.job) cancelJob();
    for (const t of state.transcripts) { await dbDel('transcripts', t.id).catch(() => {}); await dbDel('audio', t.id).catch(() => {}); }
    state.transcripts = [];
    closeModal();
    App.go('');
    toast('🗑️', 'All local data deleted.');
    updateStorageInfo();
  },
};
window.App = App;
// Internals handle for automated tests and console debugging.
window.__vs = { state, engine, speakerEngine, openAudioSource, openWav, openMp3, openFullDecode, resampleTo16k, conditionWindow, quietestCut, assignSpeakers, toSrt, toVtt, toCsv, toJsonExport, makeDocx, transcriptFullText, getT, startTranscription, splitTranscriptText, zipStore, saveTranscript, newTranscript };

// Keyboard shortcuts for transcript editing
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#overlay').classList.contains('open')) { App.closeModal(); return; }
  if (state.route.view !== 'transcript') return;
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  const p = $('#player');
  if (!p || !p.src) return;
  if (e.key === 'Enter') { e.preventDefault(); if (p.paused) p.play().catch(() => {}); else p.pause(); }
  else if (e.shiftKey && e.key === 'ArrowLeft') { e.preventDefault(); p.currentTime = Math.max(0, p.currentTime - 5); }
  else if (e.shiftKey && e.key === 'ArrowRight') { e.preventDefault(); p.currentTime = Math.min(p.duration || 0, p.currentTime + 5); }
  else if (e.shiftKey && e.key === 'ArrowUp') {
    const el = document.activeElement && document.activeElement.closest('.seg-x');
    const t = getT(state.route.id);
    if (el && t) { e.preventDefault(); const s = t.segments[parseInt(el.dataset.i, 10)]; if (s) App.seek(s.start); }
  }
});

async function updateStorageInfo() {
  try {
    const est = await navigator.storage.estimate();
    $('#stor-info').textContent = fmtBytes(est.usage || 0);
  } catch (e) {}
}

/* ════════════════════════════════════════════════════════════════
   Init
   ════════════════════════════════════════════════════════════════ */
$('#file-input').addEventListener('change', function() { enqueueFiles(this.files); this.value = ''; });

(async function init() {
  try {
    await dbOpen();
    const saved = await dbGet('settings', 'app');
    if (saved && saved.value) Object.assign(state.settings, saved.value);
    const all = await dbAll('transcripts');
    state.transcripts = all || [];
    let dirty = false;
    for (const t of state.transcripts) {
      if (t.processedSec == null) t.processedSec = 0;
      if (t.status === 'processing') {
        t.status = 'error';
        t.error = canResume(t)
          ? 'Transcription was interrupted (the page was closed) at ' + fmtClock(t.processedSec) + '. Resume below to continue from there.'
          : 'Transcription was interrupted (the page was closed). Retry below.';
        dirty = true;
      }
    }
    sortLib();
    if (dirty) for (const t of state.transcripts) await dbPut('transcripts', t).catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (err) {
    console.error(err);
    toast('❌', 'Local storage is unavailable (' + err.message + '). Transcripts will not be saved between visits.');
  }
  try {
    state.gpu = (navigator.gpu && await navigator.gpu.requestAdapter()) ? 'webgpu' : 'wasm';
  } catch (e) { state.gpu = 'wasm'; }
  window.addEventListener('hashchange', render);
  render();
  updateStorageInfo();
})();
